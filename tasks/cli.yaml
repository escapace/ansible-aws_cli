---
- name: validate aws cli architecture
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in ["x86_64", "aarch64"]
    fail_msg: aws cli requires x86_64 or aarch64

- name: install package dependencies
  ansible.builtin.package:
    name:
      - python3
      - unzip
    state: present

- name: inspect the aws cli installation
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: aws_cli_stat

- name: install aws cli
  when:
    - not aws_cli_stat.stat.exists
    - not ansible_check_mode
  block:
    - name: download the awscli archive
      ansible.builtin.get_url:
        url: "{{ aws_cli_archive }}"
        dest: /tmp/awscli.zip
        mode: "0644"
        timeout: 30
        use_netrc: false

    - name: unarchive the installer
      ansible.builtin.unarchive:
        src: /tmp/awscli.zip
        dest: /tmp
        remote_src: true

    - name: install aws cli package
      ansible.builtin.command:
        cmd: /tmp/aws/install
        chdir: /tmp/aws
        creates: /usr/local/bin/aws

    - name: clean up
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /tmp/awscli.zip
        - /tmp/aws

- name: link aws cli
  ansible.builtin.file:
    src: /usr/local/bin/aws
    dest: /usr/bin/aws
    owner: root
    group: root
    state: link
  when: aws_cli_stat.stat.exists or not ansible_check_mode
